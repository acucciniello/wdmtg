name: Build and test

on:
  push:
    paths: ['desktop/**', 'ios/**', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-tests:
    name: Desktop tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test

  mac-app:
    name: Mac app
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build the app
        run: npm run dist -- --mac --arm64 --x64
      - name: Check the app is signed well enough to launch
        run: |
          for app in dist/mac*/WDMTG.app; do
            echo "== $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            ls "$app/Contents/Resources/app.asar.unpacked/node_modules/get-windows/main"
          done
      - name: Launch the packaged app and prove it tracks
        run: |
          arch=$(uname -m); dir=dist/mac; [ "$arch" = "arm64" ] && dir=dist/mac-arm64
          WDMTG_SMOKE=10000 "$dir/WDMTG.app/Contents/MacOS/WDMTG" 2>&1 | tee smoke.log
          grep '^SMOKE ' smoke.log | sed 's/^SMOKE //' | python3 -c "
          import json, sys
          s = json.load(sys.stdin)
          print(json.dumps(s, indent=2))
          assert s['tracking']['on'], 'tracker is not running'
          assert s['segments'] >= 1, 'nothing was recorded'
          assert s['tracking']['error'] is None, 'the window sampler failed: ' + str(s['tracking'])
          print('Frontmost app seen by the tracker:', s['tracking']['app'])
          "
      - uses: actions/upload-artifact@v4
        with:
          name: WDMTG-mac
          path: desktop/dist/*.dmg
          if-no-files-found: error

  iphone-app:
    name: iPhone app
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version && swift --version
      - name: Test the app's logic
        run: swift test
      - name: Build the app for the iPhone simulator
        run: |
          xcodebuild -project WDMTG.xcodeproj -target WDMTG -configuration Debug -sdk iphonesimulator build | tail -5
          test -d build/Debug-iphonesimulator/WDMTG.app
          plutil -p build/Debug-iphonesimulator/WDMTG.app/Info.plist | grep -E 'wdmtg|NSAllowsLocalNetworking|NSMotionUsage|NSLocalNetwork|CFBundleIdentifier'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the app in a simulator against the real desktop server
        run: |
          (cd ../desktop && npm ci --ignore-scripts >/dev/null && (node --no-warnings src/dev-server.js --demo --port 48555 > server.log 2>&1 &))
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:48555/api/status >/dev/null && break; sleep 1; done
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devs = [d for rt, ds in json.load(sys.stdin)['devices'].items() if 'iOS' in rt for d in ds if d['name'].startswith('iPhone')]
          print(devs[-1]['udid'])")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Debug-iphonesimulator/WDMTG.app
          mkdir -p shots
          export SIMCTL_CHILD_WDMTG_PAIR="wdmtg://pair?host=127.0.0.1&port=48555&token=ci"
          export SIMCTL_CHILD_WDMTG_DAYS_AGO=1
          for tab in day log setup; do
            SIMCTL_CHILD_WDMTG_TAB=$tab xcrun simctl launch --terminate-running-process "$UDID" app.wdmtg.ios
            sleep 12
            xcrun simctl io "$UDID" screenshot "shots/$tab.png"
          done
          xcrun simctl terminate "$UDID" app.wdmtg.ios || true
          echo "Phone sync received by the desktop server:"
          curl -sf http://127.0.0.1:48555/api/status | python3 -c "
          import json, sys
          s = json.load(sys.stdin)
          print(s.get('phoneApp'))
          assert s.get('phoneApp'), 'the iPhone app never synced with the desktop server'"
      - name: Print small previews of the screenshots into the log
        run: |
          for tab in day log setup; do
            sips -Z 1100 -s format jpeg -s formatOptions 45 "shots/$tab.png" --out "shots/$tab.jpg" >/dev/null
            echo "PREVIEW-BEGIN $tab"
            base64 -i "shots/$tab.jpg" | tr -d '\n' | fold -w 4000
            echo
            echo "PREVIEW-END $tab"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-screenshots
          path: ios/shots/*.png
